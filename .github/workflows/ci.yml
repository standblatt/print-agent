name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A newer push to the same branch cancels the running workflow; tag runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go test ./...

  # The Windows backend against the spooler of a real Windows; it prints into a file through Microsoft Print to PDF.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go test ./internal/agent ./internal/winspool

  # Known vulnerabilities in code paths we call; not a need of release, so a new report does not block releases.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  funcdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/funcdoc.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: |
          version=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo "${GITHUB_SHA::7}")
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=$version" -o bin/standblatt-print-agent-linux-$arch ./cmd/standblatt-print-agent
          done
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/
          retention-days: 7

  # The agent against a real server image; catches protocol breaks from either side. SERVER_VERSION is raised by hand
  # together with protocol changes.
  contract:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: standblatt
          POSTGRES_PASSWORD: standblatt
          POSTGRES_DB: standblatt
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U standblatt" --health-interval 2s --health-retries 30
    env:
      SERVER_VERSION: v0.20.1
      DATABASE_URL: postgres://standblatt:standblatt@localhost:5432/standblatt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: bin/
      - run: |
          docker run -d --name standblatt --network host -e DATABASE_URL -e STANDBLATT_METRICS_LISTEN= "ghcr.io/standblatt/server:$SERVER_VERSION"
          timeout 60 sh -c 'until curl -sf http://localhost:8080/readyz; do sleep 1; done'
          curl -sSf "https://raw.githubusercontent.com/standblatt/server/$SERVER_VERSION/docker/dev-seed.sql" | psql -q "$DATABASE_URL"
      - run: chmod +x bin/* && AGENT=bin/standblatt-print-agent-linux-amd64 scripts/contract.sh
      - if: failure()
        run: docker logs standblatt

  # A GitHub release with the changelog section of the version, the binaries and their checksums.
  release:
    runs-on: ubuntu-latest
    needs: [go, windows, funcdoc, build, contract]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: bin/
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [$version]" 'index($0, "## [") == 1 { p = index($0, h) == 1; next } p' CHANGELOG.md > notes.md
          test -s notes.md
          (cd bin && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md bin/*
