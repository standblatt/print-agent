name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A newer push to the same branch cancels the running workflow; tag runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go test ./...

  # The Windows backend against the spooler of a real Windows; it prints into a file through Microsoft Print to PDF.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go test ./internal/agent ./internal/winspool

  # The desktop app for every system: Windows cross-compiled without CGO (even for the wails3 tool, which needs GTK
  # on Linux otherwise), the Mac app as a disk image built with the macOS SDK, the Linux app as .deb and .rpm built
  # against GTK 4 and WebKitGTK 6.0. Every push keeps them as artifacts; tags release them.
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-amd64, os: ubuntu-latest, target: app-windows, cgo: "0" }
          - { name: darwin-arm64, os: macos-latest, target: app-dmg, goarch: arm64 }
          - { name: darwin-amd64, os: macos-latest, target: app-dmg, goarch: amd64 }
          # Pinned: packages built on a newer Ubuntu need its newer glibc.
          - { name: linux-amd64, os: ubuntu-24.04, target: app-linux-packages }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: app-linux-packages }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - if: matrix.target == 'app-linux-packages'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev rpm
          sudo gem install --no-document fpm
      - env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOARCH: ${{ matrix.goarch }}
        run: make ${{ matrix.target }} VERSION=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo "${GITHUB_SHA::7}")
      - if: matrix.target == 'app-windows'
        run: npm run check
        working-directory: app/frontend
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.name }}
          path: |
            bin/*.exe
            bin/*.dmg
            bin/*.deb
            bin/*.rpm
          if-no-files-found: error
          retention-days: 7

  # The app's Go code on Windows, where it runs.
  app-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - run: go vet ./...
      - run: go build -C .. -o bin/staticcheck.exe honnef.co/go/tools/cmd/staticcheck && ../bin/staticcheck ./...
      - run: go test ./...

  # Known vulnerabilities in code paths we call; not a need of release, so a new report does not block releases.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  funcdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/funcdoc.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: |
          version=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo "${GITHUB_SHA::7}")
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=$version" -o bin/standblatt-print-agent-linux-$arch ./cmd/standblatt-print-agent
          done
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/
          retention-days: 7

  # The agent against a real server image; catches protocol breaks from either side. SERVER_VERSION is raised by hand
  # together with protocol changes.
  contract:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: standblatt
          POSTGRES_PASSWORD: standblatt
          POSTGRES_DB: standblatt
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U standblatt" --health-interval 2s --health-retries 30
    env:
      SERVER_VERSION: v0.21.0
      DATABASE_URL: postgres://standblatt:standblatt@localhost:5432/standblatt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: bin/
      - run: |
          docker run -d --name standblatt --network host -e DATABASE_URL -e STANDBLATT_METRICS_LISTEN= "ghcr.io/standblatt/server:$SERVER_VERSION"
          timeout 60 sh -c 'until curl -sf http://localhost:8080/readyz; do sleep 1; done'
          curl -sSf "https://raw.githubusercontent.com/standblatt/server/$SERVER_VERSION/docker/dev-seed.sql" | psql -q "$DATABASE_URL"
      - run: chmod +x bin/* && AGENT=bin/standblatt-print-agent-linux-amd64 scripts/contract.sh
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: STANDBLATT_CONTRACT_URL=http://localhost:8080 go test ./internal/agent -run Contract -count=1 -v
      - if: failure()
        run: docker logs standblatt

  # A GitHub release with the changelog section of the version, the headless binaries, the desktop app for every
  # system and the checksums of all of them.
  release:
    runs-on: ubuntu-latest
    needs: [go, windows, funcdoc, build, contract, app, app-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: bin/
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [$version]" 'index($0, "## [") == 1 { p = index($0, h) == 1; next } p' CHANGELOG.md > notes.md
          test -s notes.md
          (cd bin && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md bin/*
