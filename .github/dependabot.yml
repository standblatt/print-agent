version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]
    ignore:
      - dependency-name: go
        versions: [">= 1.28"]

  # Wails (Go module and @wailsio/runtime) is raised by hand, both to the same version.
  - package-ecosystem: gomod
    directory: /app
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]
    ignore:
      - dependency-name: go
        versions: [">= 1.28"]
      - dependency-name: github.com/wailsapp/wails/v3

  - package-ecosystem: npm
    directory: /app/frontend
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@wailsio/runtime"
      # svelte-check supports TypeScript up to 6.
      - dependency-name: typescript
        versions: [">= 7"]

  # The server tag of the contract test: a pull request after each server release runs the contract test against it.
  - package-ecosystem: docker
    directory: /testdata/contract
    schedule:
      interval: daily

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [major, minor, patch]
